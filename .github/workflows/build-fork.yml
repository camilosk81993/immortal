name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install compile SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null || true

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk immortal-portal.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: immortal-portal-apk
          path: immortal-portal.apk
